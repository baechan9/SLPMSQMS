# PR 병합 조건(CMN-00-ARC-001 BR-1): 정적 검사 통과 + qms-ci 배포 검증 성공 + 로컬 Apex 테스트 전부 통과
# + 저장소 클래스별 커버리지 85% 이상 + Code Analyzer 심각도 1~2 위반 0건.
# 저장소가 공개라서 시크릿은 GitHub Secrets에만 두고, 포크 PR에 시크릿이 넘어가는 pull_request_target은 쓰지 않는다.
# 필요한 시크릿: SF_AUTH_URL_CI = `sf org display -o qms-ci --verbose --json`의 sfdxAuthUrl(qms-ci를 다시 만들면 갱신)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: 메타데이터 생성기·픽스처 최신 여부
        run: |
          python3 scripts/dev/metagen.py --check
          scripts/dev/sync-fixtures.sh --check
      - name: 한글 문자열 리터럴 0건(CMN-00-I18N-001 AC-4)
        run: python3 scripts/ci/check-korean-literals.py
      - run: npm run prettier:verify
      - run: npm run lint
      - run: npm run test:unit -- --coverage
      - name: Salesforce CLI·Code Analyzer 설치
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer
      - name: Code Analyzer(심각도 1~2 위반 0건)
        run: >
          sf code-analyzer run --target force-app-cmn --target force-app-qms --target force-app-pms
          --rule-selector Recommended --severity-threshold 2
      - name: 개발 플랜 배정표 검사(선행 위반·표 최신 여부)
        run: |
          cd docs && python3 scripts/build_dev_plan.py
          git diff --exit-code -- docs/30-dev

  validate:
    name: qms-ci 배포 검증(RunLocalTests)
    needs: static
    runs-on: ubuntu-latest
    env:
      SF_AUTH_URL_CI: ${{ secrets.SF_AUTH_URL_CI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 시크릿·메타데이터 확인
        id: pre
        run: |
          if [ -z "$SF_AUTH_URL_CI" ]; then
            echo "::notice::SF_AUTH_URL_CI 시크릿이 없어 배포 검증을 건너뜀(포크 PR 또는 시크릿 미등록)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! find force-app-cmn force-app-qms force-app-pms -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "::notice::배포할 메타데이터가 없어 배포 검증을 건너뜀"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: qms-ci 로그인
        if: steps.pre.outputs.run == 'true'
        run: |
          npm install --global @salesforce/cli
          printf '%s' "$SF_AUTH_URL_CI" > "$RUNNER_TEMP/authurl"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/authurl" --alias qms-ci
          rm -f "$RUNNER_TEMP/authurl"
      - name: dry-run 배포 + RunLocalTests + 커버리지 85%
        if: steps.pre.outputs.run == 'true'
        run: |
          mkdir -p build
          sf project deploy start --dry-run -o qms-ci --test-level RunLocalTests --wait 60 --json > build/deploy.json || true
          python3 scripts/ci/check-coverage.py build/deploy.json

  deploy-main:
    name: qms-ci를 main과 맞춤
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      SF_AUTH_URL_CI: ${{ secrets.SF_AUTH_URL_CI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포
        run: |
          if [ -z "$SF_AUTH_URL_CI" ] || ! find force-app-cmn force-app-qms force-app-pms -type f ! -name .gitkeep -print -quit | grep -q .; then
            echo "::notice::시크릿 또는 메타데이터가 없어 건너뜀"; exit 0
          fi
          npm install --global @salesforce/cli
          printf '%s' "$SF_AUTH_URL_CI" > "$RUNNER_TEMP/authurl"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/authurl" --alias qms-ci
          rm -f "$RUNNER_TEMP/authurl"
          sf project deploy start -o qms-ci --wait 60
          python3 scripts/dev/profile-lockdown.py qms-ci --hide-system-apps
