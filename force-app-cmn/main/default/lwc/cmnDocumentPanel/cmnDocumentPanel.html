<template>
  <lightning-card title={labels.title} icon-name="standard:document">
    <div class="slds-p-horizontal_small">
      <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_medium">
          <lightning-spinner
            alternative-text={labels.loading}
            size="small"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:elseif={errorMessage}>
        <p class="slds-text-color_error" role="alert">{errorMessage}</p>
      </template>
      <template lwc:elseif={noAccess}>
        <p class="slds-text-color_weak" data-id="no-access">{labels.noRead}</p>
      </template>
      <template lwc:else>
        <template lwc:if={canEdit}>
          <div
            class="slds-box slds-box_x-small slds-m-bottom_small"
            data-id="upload"
          >
            <lightning-combobox
              label={labels.docClass}
              options={uploadClassOptions}
              value={selectedClassId}
              onchange={handleClass}
              data-id="class"
            ></lightning-combobox>
            <lightning-textarea
              label={labels.changeNote}
              value={changeNote}
              max-length="1000"
              onchange={handleNote}
            ></lightning-textarea>
            <lightning-input
              type="checkbox"
              label={labels.supplierVisible}
              checked={supplierVisible}
              onchange={handleVisible}
            ></lightning-input>
            <lightning-file-upload
              label={labels.upload}
              multiple={multipleUpload}
              disabled={uploadDisabled}
              onuploadfinished={handleUploadFinished}
            ></lightning-file-upload>
            <div class="slds-m-top_x-small">
              <lightning-button
                variant="base"
                label={labels.addLink}
                onclick={toggleLink}
                data-id="toggle-link"
              ></lightning-button>
            </div>
            <template lwc:if={showLink}>
              <div class="slds-m-top_x-small" data-id="link-form">
                <lightning-combobox
                  label={labels.docClass}
                  options={linkClassOptions}
                  value={link.classId}
                  data-field="classId"
                  onchange={handleLinkField}
                ></lightning-combobox>
                <lightning-combobox
                  label={labels.storage}
                  options={storageOptions}
                  value={link.storageType}
                  data-field="storageType"
                  onchange={handleLinkField}
                ></lightning-combobox>
                <lightning-input
                  type="url"
                  label={labels.url}
                  value={link.url}
                  data-field="url"
                  onchange={handleLinkField}
                ></lightning-input>
                <lightning-input
                  label={labels.externalRef}
                  value={link.externalRef}
                  data-field="externalRef"
                  onchange={handleLinkField}
                ></lightning-input>
                <lightning-input
                  label={labels.linkTitle}
                  value={link.title}
                  data-field="title"
                  onchange={handleLinkField}
                ></lightning-input>
                <lightning-textarea
                  label={labels.changeNote}
                  value={link.note}
                  data-field="note"
                  onchange={handleLinkField}
                ></lightning-textarea>
                <lightning-button-group class="slds-m-top_x-small">
                  <lightning-button
                    label={labels.cancel}
                    onclick={toggleLink}
                  ></lightning-button>
                  <lightning-button
                    variant="brand"
                    label={labels.save}
                    disabled={isSaving}
                    onclick={handleSaveLink}
                    data-id="save-link"
                  ></lightning-button>
                </lightning-button-group>
              </div>
            </template>
          </div>
        </template>

        <template lwc:if={isEmpty}>
          <p class="slds-text-color_weak" data-id="empty">{labels.empty}</p>
        </template>
        <template for:each={groups} for:item="g">
          <div key={g.classId} class="slds-m-bottom_small" data-class={g.code}>
            <h3 class="slds-text-heading_small">
              {g.label}
              <template lwc:if={g.required}>
                <lightning-badge
                  class="slds-m-left_x-small"
                  label={labels.required}
                ></lightning-badge>
              </template>
              <template lwc:if={g.templateUrl}>
                <a
                  class="slds-m-left_small slds-text-body_small"
                  href={g.templateUrl}
                  >{labels.template}</a
                >
              </template>
            </h3>
            <template lwc:if={g.missing}>
              <p class="slds-text-color_error" data-id="missing">
                <lightning-icon
                  icon-name="utility:warning"
                  size="x-small"
                  alternative-text={labels.missing}
                ></lightning-icon>
                {labels.missing}
              </p>
            </template>
            <ul>
              <template for:each={g.documents} for:item="d">
                <li key={d.id} class="slds-m-top_xx-small" data-doc={d.id}>
                  <template lwc:if={d.currentView}>
                    <span class="slds-m-right_x-small"
                      >{d.currentView.label}</span
                    >
                    <template lwc:if={d.currentView.isFile}>
                      <lightning-button
                        variant="base"
                        label={d.currentView.displayName}
                        data-file={d.currentView.contentDocumentId}
                        onclick={openFile}
                      ></lightning-button>
                    </template>
                    <template lwc:elseif={d.currentView.isLink}>
                      <a href={d.currentView.url} target="_blank" rel="noopener"
                        >{d.currentView.displayName}</a
                      >
                    </template>
                    <template lwc:else>
                      <span>{d.currentView.displayName}</span>
                    </template>
                    <lightning-badge
                      class="slds-m-left_x-small"
                      label={d.currentView.statusLabel}
                    ></lightning-badge>
                    <template lwc:if={d.currentView.duplicate}>
                      <span
                        class="slds-text-color_error slds-m-left_x-small"
                        data-id="duplicate"
                      >
                        <lightning-icon
                          icon-name="utility:warning"
                          size="x-small"
                          alternative-text={labels.duplicate}
                        ></lightning-icon>
                        {labels.duplicate}
                      </span>
                    </template>
                  </template>
                  <template lwc:if={d.canSubmit}>
                    <lightning-button
                      class="slds-m-left_small"
                      label={labels.submit}
                      data-id={d.id}
                      disabled={isSaving}
                      onclick={handleSubmit}
                    ></lightning-button>
                  </template>
                  <lightning-button
                    class="slds-m-left_small"
                    variant="base"
                    label={labels.history}
                    data-id={d.id}
                    onclick={toggleHistory}
                  ></lightning-button>
                  <template lwc:if={d.canCompare}>
                    <lightning-button
                      class="slds-m-left_small compare"
                      variant="base"
                      label={labels.compare}
                      data-id={d.id}
                      onclick={openCompare}
                    ></lightning-button>
                  </template>
                  <template lwc:if={d.isExpanded}>
                    <ul class="slds-m-left_medium" data-id="history">
                      <template for:each={d.revisions} for:item="r">
                        <li key={r.id} class="slds-text-body_small">
                          {r.label} · {r.statusLabel} · {r.displayName} ·
                          {r.createdByName}
                          <lightning-formatted-date-time
                            class="slds-m-left_x-small"
                            value={r.createdDate}
                            year="numeric"
                            month="2-digit"
                            day="2-digit"
                          ></lightning-formatted-date-time>
                          <template lwc:if={r.changeNote}>
                            <span class="slds-m-left_x-small"
                              >{r.changeNote}</span
                            >
                          </template>
                        </li>
                      </template>
                    </ul>
                  </template>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
