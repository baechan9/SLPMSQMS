<template>
  <template lwc:if={model.empty}>
    <p class="slds-text-color_weak slds-p-around_small">{labels.empty}</p>
  </template>
  <template lwc:else>
    <div class="slds-grid slds-grid_vertical-align-end slds-m-bottom_xx-small">
      <div class="slds-col slds-size_1-of-3"></div>
      <div class="slds-col slds-size_2-of-3 header-track">
        <template for:each={model.ticks} for:item="t">
          <span key={t.key} class="tick slds-text-color_weak" style={t.style}
            >{t.label}</span
          >
        </template>
        <template lwc:if={model.showToday}>
          <span
            class="today-label slds-text-color_error"
            style={model.todayStyle}
            >{labels.today}</span
          >
        </template>
      </div>
    </div>
    <ul>
      <template for:each={model.bars} for:item="b">
        <li key={b.key} class="slds-grid slds-grid_vertical-align-center row">
          <div class="slds-col slds-size_1-of-3 slds-p-right_x-small">
            <p class="slds-truncate" title={b.label}>{b.label}</p>
            <template lwc:if={b.warning}>
              <p class="slds-grid slds-grid_vertical-align-center">
                <lightning-icon
                  icon-name="utility:warning"
                  variant="warning"
                  size="xx-small"
                  alternative-text={b.warning}
                  class="slds-m-right_xx-small"
                ></lightning-icon>
                <span class="slds-text-body_small slds-truncate"
                  >{b.warning}</span
                >
              </p>
            </template>
          </div>
          <div class="slds-col slds-size_2-of-3 track">
            <template for:each={model.ticks} for:item="t">
              <span key={t.key} class="grid-line" style={t.style}></span>
            </template>
            <template lwc:if={model.showToday}>
              <span class="today" style={model.todayStyle}></span>
            </template>
            <span class={b.barClass} style={b.style} title={b.title}>
              <span class="slds-assistive-text">{b.title}</span>
            </span>
          </div>
        </li>
      </template>
    </ul>
    <template lwc:if={undatedText}>
      <p class="slds-text-color_weak slds-m-top_x-small">{undatedText}</p>
    </template>
  </template>
</template>
