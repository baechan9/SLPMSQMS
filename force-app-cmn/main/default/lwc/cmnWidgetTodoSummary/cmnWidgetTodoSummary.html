<template>
  <template lwc:if={isLoading}>
    <div class="slds-is-relative slds-p-around_medium">
      <lightning-spinner
        alternative-text={labels.loading}
        size="small"
      ></lightning-spinner>
    </div>
  </template>
  <template lwc:elseif={errorMessage}>
    <div role="alert">
      <p class="slds-text-color_error">{errorMessage}</p>
      <lightning-button
        variant="base"
        label={labels.retry}
        onclick={load}
        data-id="retry"
      ></lightning-button>
    </div>
  </template>
  <template lwc:else>
    <div class="slds-grid slds-gutters_x-small slds-text-align_center">
      <div class="slds-col" data-id="task">
        <p class="slds-text-heading_large">{task}</p>
        <p class="slds-text-body_small slds-text-color_weak">{labels.task}</p>
      </div>
      <div class="slds-col" data-id="approval">
        <p class="slds-text-heading_large">{approval}</p>
        <p class="slds-text-body_small slds-text-color_weak">
          {labels.approval}
        </p>
      </div>
      <div class="slds-col" data-id="overdue">
        <p class="slds-text-heading_large">
          <template lwc:if={hasOverdue}>
            <lightning-icon
              icon-name="utility:warning"
              size="x-small"
              alternative-text={labels.overdue}
            ></lightning-icon>
          </template>
          {overdue}
        </p>
        <p class="slds-text-body_small slds-text-color_weak">
          {labels.overdue}
        </p>
      </div>
    </div>
  </template>
</template>
