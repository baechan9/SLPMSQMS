<template>
  <div class="slds-card slds-p-around_medium">
    <template lwc:if={isLoading}>
      <div class="slds-is-relative slds-p-around_large">
        <lightning-spinner
          alternative-text={labels.loading}
          size="small"
        ></lightning-spinner>
      </div>
    </template>
    <template lwc:elseif={errorMessage}>
      <div role="alert" data-id="error">
        <p class="slds-text-color_error">{errorMessage}</p>
        <lightning-button
          variant="base"
          label={labels.retry}
          onclick={load}
          data-id="retry"
        ></lightning-button>
      </div>
    </template>
    <template lwc:else>
      <div class="slds-media slds-media_center slds-m-bottom_medium">
        <div class="slds-media__figure">
          <lightning-icon icon-name={iconName} size="medium"></lightning-icon>
        </div>
        <div class="slds-media__body">
          <h1 class="slds-text-heading_medium" data-id="title">{menu.title}</h1>
          <p class="slds-text-body_regular slds-text-color_weak">
            {menu.description}
          </p>
          <p
            class="slds-text-body_small slds-text-color_weak"
            data-id="summary"
          >
            {summary}
          </p>
        </div>
      </div>
      <template lwc:if={isEmpty}>
        <p class="slds-text-color_weak" data-id="empty">{labels.empty}</p>
      </template>
      <template lwc:else>
        <ul class="slds-grid slds-wrap slds-gutters_x-small">
          <template for:each={items} for:item="i">
            <li
              key={i.key}
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-bottom_small"
              data-id="tile"
            >
              <article class="slds-box slds-box_small tile">
                <div class="slds-media slds-media_center">
                  <div class="slds-media__figure">
                    <lightning-icon
                      icon-name={i.iconName}
                      size="small"
                    ></lightning-icon>
                  </div>
                  <div class="slds-media__body slds-truncate">
                    <h2 class="slds-text-heading_small slds-truncate">
                      {i.title}
                    </h2>
                  </div>
                  <div class="slds-media__figure slds-media__figure_reverse">
                    <span class="slds-text-body_small slds-text-color_weak"
                      >{i.featureCode}</span
                    >
                  </div>
                </div>
                <p
                  class="slds-text-body_small slds-text-color_weak slds-m-top_x-small description"
                >
                  {i.description}
                </p>
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-top_small"
                >
                  <span class={i.statusClass} data-id="status"
                    >{i.statusLabel}</span
                  >
                  <template lwc:if={i.plannedText}>
                    <span
                      class="slds-text-body_small slds-text-color_weak slds-m-left_x-small"
                      data-id="planned"
                      >{i.plannedText}</span
                    >
                  </template>
                  <template lwc:if={i.ready}>
                    <lightning-button
                      class="slds-col_bump-left"
                      label={labels.open}
                      onclick={open}
                      data-key={i.key}
                      data-id="open"
                    ></lightning-button>
                  </template>
                </div>
              </article>
            </li>
          </template>
        </ul>
      </template>
    </template>
  </div>
</template>
