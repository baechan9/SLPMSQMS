<template>
  <div class="runner slds-is-relative">
    <template lwc:if={isLoading}>
      <lightning-spinner
        alternative-text={labels.loading}
        size="medium"
      ></lightning-spinner>
    </template>
    <template lwc:if={noRecord}>
      <p class="slds-text-color_weak slds-p-around_medium no-record">
        {labels.noRecord}
      </p>
    </template>
    <template lwc:if={loadError}>
      <p
        class="slds-text-color_error slds-p-around_medium load-error"
        role="alert"
      >
        {loadError}
      </p>
    </template>

    <template lwc:if={sheet}>
      <!-- 상단 -->
      <div class="slds-box slds-theme_default slds-m-bottom_small header">
        <h1 class="slds-text-heading_medium slds-truncate" title={sheet.title}>
          {sheet.title}
        </h1>
        <p class="slds-text-body_small slds-text-color_weak">
          {sheet.recordNo} {sheet.subtitle}
        </p>
        <div
          class="slds-grid slds-wrap slds-grid_vertical-align-center slds-gutters_x-small slds-m-top_small"
        >
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <p class="slds-text-body_small progress-text">{progressText}</p>
            <lightning-progress-bar
              value={progressValue}
              size="large"
            ></lightning-progress-bar>
          </div>
          <div
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-grid slds-wrap slds-grid_align-end slds-grid_vertical-align-center"
          >
            <lightning-input
              type="toggle"
              label={labels.myOnly}
              checked={myOnly}
              message-toggle-active=""
              message-toggle-inactive=""
              onchange={handleMyOnly}
              class="my-only slds-m-right_small"
            ></lightning-input>
            <template lwc:if={showTableToggle}>
              <lightning-radio-group
                type="button"
                label={labels.viewLabel}
                variant="label-hidden"
                options={viewOptions}
                value={view}
                onchange={handleView}
                class="view slds-m-right_small"
              ></lightning-radio-group>
            </template>
            <template lwc:if={showScoreButton}>
              <lightning-button
                label={labels.showScore}
                icon-name="utility:metrics"
                onclick={handleShowScore}
                class="btn-score"
              ></lightning-button>
            </template>
          </div>
        </div>
        <template lwc:if={readOnly}>
          <p class="slds-m-top_small slds-text-color_weak read-only">
            <lightning-icon
              icon-name="utility:lock"
              size="x-small"
              alternative-text={labels.readOnly}
              class="slds-m-right_xx-small"
            ></lightning-icon>
            {labels.readOnly}
          </p>
        </template>
      </div>

      <!-- 점수 미리보기 -->
      <template lwc:if={scoreOpen}>
        <section
          class="slds-box slds-m-bottom_small score-panel"
          aria-label={labels.scoreTitle}
        >
          <div class="slds-grid slds-grid_align-spread">
            <h2 class="slds-text-heading_small">{labels.scoreTitle}</h2>
            <lightning-button-icon
              icon-name="utility:close"
              variant="bare"
              alternative-text={labels.scoreTitle}
              onclick={handleCloseScore}
            ></lightning-button-icon>
          </div>
          <template lwc:if={scoreView}>
            <p class="slds-text-heading_medium score-percent">
              {scoreView.percent} {scoreView.grade}
            </p>
            <template lwc:if={scoreView.before}>
              <p class="score-before">{scoreView.before}</p>
            </template>
            <ul class="slds-list_dotted">
              <template for:each={scoreView.reasons} for:item="r">
                <li key={r.key} class="score-reason">{r.text}</li>
              </template>
            </ul>
            <ul class="slds-m-top_x-small">
              <template for:each={scoreView.sections} for:item="s">
                <li key={s.key} class="score-section">{s.text}</li>
              </template>
            </ul>
            <p class="slds-m-top_x-small score-unanswered">
              {scoreView.unanswered}
            </p>
          </template>
        </section>
      </template>

      <template for:each={generalErrors} for:item="msg">
        <p
          key={msg}
          class="slds-text-color_error slds-m-bottom_x-small general-error"
          role="alert"
        >
          {msg}
        </p>
      </template>
      <template lwc:if={failMessage}>
        <p
          class="slds-text-color_error slds-m-bottom_x-small save-failed"
          role="alert"
        >
          {failMessage}
        </p>
      </template>

      <div class="slds-grid slds-wrap slds-gutters_small">
        <!-- 요소 목록 -->
        <template lwc:if={isPhone}>
          <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
            <lightning-combobox
              label={labels.sections}
              options={sectionOptions}
              value={currentSectionKey}
              onchange={handleSectionSelect}
              class="section-select"
            ></lightning-combobox>
          </div>
        </template>
        <template lwc:else>
          <nav
            class="slds-col slds-size_1-of-4 sections"
            aria-label={labels.sections}
          >
            <h2 class="slds-text-title_caps slds-m-bottom_x-small">
              {labels.sections}
            </h2>
            <ul>
              <template for:each={sectionItems} for:item="s">
                <li key={s.key}>
                  <button
                    type="button"
                    class={s.className}
                    data-key={s.key}
                    aria-current={s.ariaCurrent}
                    disabled={s.disabled}
                    onclick={handleSectionClick}
                  >
                    <span class="slds-truncate">{s.label}</span>
                    <span class="slds-m-left_x-small slds-text-color_weak"
                      >{s.progress}</span
                    >
                    <template lwc:if={s.complete}>
                      <lightning-icon
                        icon-name="utility:check"
                        size="xx-small"
                        alternative-text={s.progress}
                        class="slds-m-left_xx-small"
                      ></lightning-icon>
                    </template>
                  </button>
                </li>
              </template>
            </ul>
          </nav>
        </template>

        <!-- 본문 -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-4 body">
          <template lwc:if={isCards}>
            <template lwc:if={current}>
              <article class="slds-card question-card">
                <div
                  class="slds-card__body slds-card__body_inner slds-p-vertical_medium"
                >
                  <h2 class="slds-text-heading_medium question-title">
                    <template lwc:if={current.isStar}>
                      <lightning-icon
                        icon-name="utility:favorite"
                        size="x-small"
                        alternative-text={labels.star}
                        class="slds-m-right_x-small star"
                      ></lightning-icon>
                    </template>
                    {current.title}
                  </h2>
                  <template lwc:if={current.hasGuidance}>
                    <lightning-button
                      variant="base"
                      label={labels.guidance}
                      onclick={handleGuidance}
                      class="btn-guidance"
                    ></lightning-button>
                    <template lwc:if={guidanceOpen}>
                      <p
                        class="slds-box slds-box_x-small slds-m-top_x-small guidance"
                      >
                        {current.question.guidance}
                      </p>
                    </template>
                  </template>

                  <fieldset class="slds-form-element slds-m-top_medium answer">
                    <legend
                      class="slds-form-element__legend slds-form-element__label"
                    >
                      {labels.answer}
                    </legend>
                    <template lwc:if={current.isScoreSteps}>
                      <div class="slds-button-group score-buttons" role="group">
                        <template for:each={current.scoreButtons} for:item="b">
                          <button
                            key={b.key}
                            type="button"
                            class={b.className}
                            data-value={b.value}
                            aria-pressed={b.pressed}
                            disabled={current.disabled}
                            onclick={handleScore}
                          >
                            {b.label}
                          </button>
                        </template>
                      </div>
                    </template>
                    <template lwc:if={current.isPoints}>
                      <lightning-input
                        type="number"
                        label={current.pointsLabel}
                        min="0"
                        max={current.maxPoints}
                        step="1"
                        value={current.points}
                        data-field="points"
                        disabled={current.disabled}
                        onchange={handleNumber}
                        class="points-input"
                      ></lightning-input>
                    </template>
                    <template lwc:if={current.isChoice}>
                      <div class="slds-grid slds-gutters_small">
                        <template for:each={current.choiceButtons} for:item="b">
                          <div key={b.key} class="slds-col">
                            <button
                              type="button"
                              class={b.className}
                              data-field={b.field}
                              data-value={b.value}
                              aria-pressed={b.pressed}
                              disabled={current.disabled}
                              onclick={handleChoice}
                            >
                              {b.label}
                            </button>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template lwc:if={current.isDefect}>
                      <div class="slds-grid slds-wrap slds-gutters_x-small">
                        <lightning-input
                          class="slds-col defect"
                          type="number"
                          min="0"
                          step="1"
                          label={labels.sampleQty}
                          value={current.sampleQty}
                          data-field="sampleQty"
                          disabled={current.disabled}
                          onchange={handleNumber}
                        ></lightning-input>
                        <lightning-input
                          class="slds-col defect"
                          type="number"
                          min="0"
                          step="1"
                          label={labels.defectA}
                          value={current.defectA}
                          data-field="defectA"
                          disabled={current.disabled}
                          onchange={handleNumber}
                        ></lightning-input>
                        <lightning-input
                          class="slds-col defect"
                          type="number"
                          min="0"
                          step="1"
                          label={labels.defectB}
                          value={current.defectB}
                          data-field="defectB"
                          disabled={current.disabled}
                          onchange={handleNumber}
                        ></lightning-input>
                        <lightning-input
                          class="slds-col defect"
                          type="number"
                          min="0"
                          step="1"
                          label={labels.defectC}
                          value={current.defectC}
                          data-field="defectC"
                          disabled={current.disabled}
                          onchange={handleNumber}
                        ></lightning-input>
                      </div>
                    </template>
                    <template lwc:if={current.isText}>
                      <lightning-textarea
                        label={labels.answer}
                        variant="label-hidden"
                        value={current.text}
                        data-field="text"
                        disabled={current.disabled}
                        onchange={handleTextField}
                        class="answer-text"
                      ></lightning-textarea>
                    </template>
                  </fieldset>

                  <template lwc:if={current.allowNa}>
                    <lightning-input
                      type="checkbox"
                      label={labels.na}
                      checked={current.isNa}
                      disabled={readOnly}
                      onchange={handleNa}
                      class="slds-m-top_small na"
                    ></lightning-input>
                    <template lwc:if={current.isNa}>
                      <lightning-textarea
                        label={labels.naReason}
                        required
                        value={current.naReason}
                        data-field="naReason"
                        disabled={readOnly}
                        onchange={handleTextField}
                        class="na-reason"
                      ></lightning-textarea>
                    </template>
                  </template>

                  <lightning-textarea
                    label={labels.notes}
                    value={current.notes}
                    data-field="notes"
                    disabled={readOnly}
                    onchange={handleTextField}
                    class="slds-m-top_small notes"
                  ></lightning-textarea>
                  <template lwc:if={current.noteHint}>
                    <p class="slds-text-body_small note-hint">
                      <lightning-icon
                        icon-name="utility:info"
                        size="xx-small"
                        alternative-text={labels.notesHint}
                        class="slds-m-right_xx-small"
                      ></lightning-icon>
                      {labels.notesHint}
                    </p>
                  </template>
                  <template lwc:if={current.showNoFollowUpReason}>
                    <lightning-textarea
                      label={labels.noFollowUpReason}
                      value={current.noFollowUpReason}
                      data-field="noFollowUpReason"
                      disabled={readOnly}
                      onchange={handleTextField}
                      class="no-follow-up"
                    ></lightning-textarea>
                  </template>

                  <div
                    class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-top_small"
                  >
                    <template lwc:if={current.showPhoto}>
                      <c-cmn-photo-capture
                        record-id={recordId}
                        doc-class={sheet.photoDocClass}
                        onuploaded={handlePhotos}
                        class="slds-m-right_small"
                      ></c-cmn-photo-capture>
                    </template>
                    <template lwc:if={current.photoText}>
                      <span
                        class="slds-text-body_small slds-m-right_small photo-count"
                        >{current.photoText}</span
                      >
                    </template>
                    <template lwc:if={current.hasFollowUp}>
                      <span class="slds-text-body_small follow-up-done">
                        <lightning-icon
                          icon-name="utility:task"
                          size="xx-small"
                          alternative-text={labels.followUpCreated}
                          class="slds-m-right_xx-small"
                        ></lightning-icon>
                        {labels.followUpCreated}
                      </span>
                    </template>
                    <template lwc:elseif={sheet.editable}>
                      <lightning-button
                        label={labels.followUp}
                        icon-name="utility:task"
                        onclick={handleFollowUp}
                        class="btn-follow-up"
                      ></lightning-button>
                    </template>
                  </div>

                  <template for:each={current.errors} for:item="msg">
                    <p
                      key={msg}
                      class="slds-text-color_error slds-m-top_x-small card-error"
                      role="alert"
                    >
                      {msg}
                    </p>
                  </template>
                </div>
              </article>
            </template>
            <template lwc:else>
              <p class="slds-box slds-text-color_weak no-questions">
                {labels.noQuestions}
              </p>
            </template>
          </template>
          <template lwc:else>
            <table
              class="slds-table slds-table_bordered slds-table_cell-buffer question-table"
            >
              <tbody>
                <template for:each={tableRows} for:item="row">
                  <tr key={row.key} class={row.rowClass}>
                    <th scope="row">
                      {row.no}
                      <template lwc:if={row.isStar}>
                        <lightning-icon
                          icon-name="utility:favorite"
                          size="xx-small"
                          alternative-text={labels.star}
                          class="slds-m-left_xx-small"
                        ></lightning-icon>
                      </template>
                    </th>
                    <td class="slds-cell-wrap">{row.text}</td>
                    <td class="answer-cell">{row.answer}</td>
                    <td class="slds-cell-wrap">{row.notes}</td>
                    <td>
                      <template lwc:if={row.hasFollowUp}>
                        <lightning-icon
                          icon-name="utility:task"
                          size="xx-small"
                          alternative-text={labels.followUpCreated}
                        ></lightning-icon>
                      </template>
                    </td>
                    <td>
                      <lightning-button
                        variant="base"
                        label={labels.open}
                        data-key={row.key}
                        onclick={handleOpenRow}
                        class="btn-open"
                      ></lightning-button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
        </div>
      </div>

      <!-- 하단 고정 -->
      <div
        class="footer slds-grid slds-wrap slds-grid_vertical-align-center slds-grid_align-spread slds-p-around_small"
      >
        <div class="slds-col slds-grid slds-grid_vertical-align-center">
          <template lwc:if={isCards}>
            <lightning-button
              label={labels.prev}
              icon-name="utility:chevronleft"
              onclick={handlePrev}
              disabled={current.prevDisabled}
              class="btn-prev slds-m-right_x-small"
            ></lightning-button>
            <lightning-button
              label={labels.next}
              icon-name="utility:chevronright"
              icon-position="right"
              onclick={handleNext}
              disabled={current.nextDisabled}
              class="btn-next slds-m-right_small"
            ></lightning-button>
          </template>
          <span class="slds-text-body_small status-text" role="status"
            >{statusText}</span
          >
        </div>
        <template lwc:if={sheet.editable}>
          <div class="slds-col slds-grow-none">
            <template lwc:if={showSaveNow}>
              <lightning-button
                label={labels.saveNow}
                onclick={handleSaveNow}
                class="btn-save-now slds-m-right_x-small"
              ></lightning-button>
            </template>
            <lightning-button
              variant="brand"
              label={labels.submit}
              onclick={handleSubmit}
              disabled={isSaving}
              class="btn-submit"
            ></lightning-button>
          </div>
        </template>
      </div>
      <template lwc:if={isSaving}>
        <lightning-spinner
          alternative-text={labels.loading}
          size="small"
        ></lightning-spinner>
      </template>
    </template>
  </div>
</template>
