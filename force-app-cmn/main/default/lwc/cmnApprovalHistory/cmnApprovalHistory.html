<template>
  <lightning-card title={labels.title} icon-name="standard:timeline">
    <div class="slds-p-horizontal_small">
      <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_medium">
          <lightning-spinner
            alternative-text={labels.loading}
            size="small"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:elseif={errorMessage}>
        <p class="slds-text-color_error" role="alert">{errorMessage}</p>
      </template>
      <template lwc:elseif={isEmpty}>
        <p class="slds-text-color_weak" data-id="empty">{labels.empty}</p>
      </template>
      <template lwc:else>
        <template for:each={versions} for:item="v">
          <section
            key={v.requestId}
            class="slds-m-bottom_small"
            data-version={v.version}
          >
            <h3 class="slds-text-heading_small">{v.heading}</h3>
            <p class="slds-text-body_small slds-text-color_weak">
              {v.drafterName}
              <lightning-formatted-date-time
                class="slds-m-left_x-small"
                value={v.submittedAt}
                year="numeric"
                month="2-digit"
                day="2-digit"
                hour="2-digit"
                minute="2-digit"
              ></lightning-formatted-date-time>
            </p>
            <ul class="slds-m-left_small">
              <template for:each={v.steps} for:item="s">
                <li key={s.id} class="slds-text-body_small slds-m-top_xx-small">
                  {s.stepNo} · {s.stepType} · {s.approverName} · {s.status}
                  <template lwc:if={s.actorLabel}>
                    <span class="slds-m-left_x-small" data-id="actor"
                      >{s.actorLabel}</span
                    >
                    <lightning-formatted-date-time
                      class="slds-m-left_x-small"
                      value={s.actedAt}
                      year="numeric"
                      month="2-digit"
                      day="2-digit"
                      hour="2-digit"
                      minute="2-digit"
                    ></lightning-formatted-date-time>
                  </template>
                  <template lwc:if={s.comment}>
                    <span class="slds-m-left_x-small slds-text-color_weak"
                      >{s.comment}</span
                    >
                  </template>
                </li>
              </template>
            </ul>
          </section>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
