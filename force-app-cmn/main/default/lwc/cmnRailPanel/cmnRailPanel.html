<template>
  <div class={sectionClass} data-id="panel" data-key={panel.key}>
    <h3 class="slds-section__title">
      <button
        class="slds-button slds-section__title-action"
        aria-expanded={ariaExpanded}
        onclick={toggle}
        data-id="toggle"
      >
        <lightning-icon
          icon-name={chevron}
          size="x-small"
          class="slds-m-right_x-small"
        ></lightning-icon>
        <span class="slds-truncate" title={panel.title}>{panel.title}</span>
        <template lwc:if={hasBadge}>
          <span
            class="slds-badge slds-m-left_x-small"
            title={badgeText}
            data-id="badge"
            >{badge}</span
          >
        </template>
      </button>
    </h3>
    <template lwc:if={isOpen}>
      <div class="slds-section__content" data-id="body">
        <template lwc:if={hasError}>
          <div role="alert" data-id="error">
            <p class="slds-text-color_error">{labels.error}</p>
            <lightning-button
              variant="base"
              label={labels.retry}
              onclick={handleRetry}
              data-id="retry"
            ></lightning-button>
          </div>
        </template>
        <template lwc:elseif={showComponent}>
          <lwc:component
            lwc:is={ctor}
            record-id={recordId}
            object-api-name={objectApiName}
            config={config}
            variant="rail"
            size="S"
            onrailbadge={handleBadge}
            data-id="component"
          ></lwc:component>
        </template>
        <template lwc:else>
          <div class="slds-is-relative slds-p-around_medium">
            <lightning-spinner
              alternative-text={labels.loading}
              size="small"
            ></lightning-spinner>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
